<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Gamelle &amp; Panier</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16b98a"/>
      <stop offset="1" stop-color="#046a4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#012e22" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Fond plein cadre : iOS applique lui-même les coins arrondis -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(512 512) scale(1.1) translate(-512 -512) translate(0,-6)" filter="url(#soft)">
    <!-- Anse de panier -->
    <path d="M336 478 C336 232 688 232 688 478" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round"/>

    <!-- Rebord de la gamelle -->
    <rect x="214" y="478" width="596" height="46" rx="23" fill="#ffffff"/>

    <!-- Corps de la gamelle -->
    <path d="M250 560 H774 C774 700 660 800 512 800 C364 800 250 700 250 560 Z" fill="#ffffff"/>

    <!-- Feuille -->
    <g transform="translate(512 396) rotate(24) scale(0.8)">
      <path d="M0 -92 C58 -58 58 52 0 92 C-58 52 -58 -58 0 -92 Z" fill="#b7f5d8"/>
      <path d="M0 -62 V70" stroke="#0a8a64" stroke-width="9" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
